services:
  postgres:
    image: postgres:16-alpine
    container_name: dfs-postgres
    environment:
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: dfs
      POSTGRES_DB: dfs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs -d dfs"]
      interval: 5s
      timeout: 3s
      retries: 10

  metadata-service:
    build:
      context: .
      args:
        SERVICE: "@dfs/metadata-service"
    container_name: metadata-service
    environment:
      DATABASE_URL: postgres://dfs:dfs@postgres:5432/dfs
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  storage-node-1:
    build:
      context: .
      args:
        SERVICE: "@dfs/storage-node"
    container_name: storage-node-1
    environment:
      NODE_ID: storage-node-1
      PORT: 7001
      METADATA_URL: http://metadata-service:4000
      ADVERTISED_ADDRESS: http://storage-node-1:7001
      DATA_DIR: /data
    volumes:
      - storage-node-1-data:/data
    depends_on:
      - metadata-service

  storage-node-2:
    build:
      context: .
      args:
        SERVICE: "@dfs/storage-node"
    container_name: storage-node-2
    environment:
      NODE_ID: storage-node-2
      PORT: 7001
      METADATA_URL: http://metadata-service:4000
      ADVERTISED_ADDRESS: http://storage-node-2:7001
      DATA_DIR: /data
    volumes:
      - storage-node-2-data:/data
    depends_on:
      - metadata-service

  storage-node-3:
    build:
      context: .
      args:
        SERVICE: "@dfs/storage-node"
    container_name: storage-node-3
    environment:
      NODE_ID: storage-node-3
      PORT: 7001
      METADATA_URL: http://metadata-service:4000
      ADVERTISED_ADDRESS: http://storage-node-3:7001
      DATA_DIR: /data
    volumes:
      - storage-node-3-data:/data
    depends_on:
      - metadata-service

  storage-node-4:
    build:
      context: .
      args:
        SERVICE: "@dfs/storage-node"
    container_name: storage-node-4
    environment:
      NODE_ID: storage-node-4
      PORT: 7001
      METADATA_URL: http://metadata-service:4000
      ADVERTISED_ADDRESS: http://storage-node-4:7001
      DATA_DIR: /data
    volumes:
      - storage-node-4-data:/data
    depends_on:
      - metadata-service

  cli:
    build:
      context: .
      args:
        SERVICE: "@dfs/cli"
    profiles:
      - cli
    environment:
      METADATA_URL: http://metadata-service:4000
    entrypoint: ["pnpm", "--filter", "@dfs/cli", "start", "--"]
    depends_on:
      - metadata-service
      - storage-node-1
      - storage-node-2
      - storage-node-3
      - storage-node-4

volumes:
  postgres-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
  storage-node-4-data: